name: Abogen Biosciences
description: >-
  Abogen Biosciences (Suzhou Abogen Biosciences, 苏州艾博生物科技有限公司) is an
  industry-leading clinical-stage biotech company founded in January 2019 and
  headquartered in Suzhou, China, dedicated to developing transformative
  medicines through messenger RNA (mRNA) innovation. The company has built
  full-scale in-house capabilities spanning the entire mRNA drug-development
  cycle — protein engineering, mRNA sequence design and synthesis, lipid
  nanoparticle (LNP) delivery, formulation, and commercial-scale manufacturing —
  underpinned by proprietary mRNA and nano-delivery technology platforms. Its
  pipeline covers infectious-disease prevention and tumor immunology, including
  an EUA-authorized product and multiple clinical-stage candidates. Abogen is a
  portfolio company of Qiming Venture Partners. This profile was surfaced through
  the API Evangelist VC-portfolio enrichment pipeline; the company publishes a
  corporate website but no public developer or API surface.
